plugins {
    id "java"
    id "application"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

version "0.1"
group "dev.deskriders.printrider"

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Micronaut BOM (4.x uses io.micronaut.platform)
    annotationProcessor platform("io.micronaut.platform:micronaut-platform:${micronautVersion}")
    annotationProcessor "io.micronaut:micronaut-inject-java"

    implementation platform("io.micronaut.platform:micronaut-platform:${micronautVersion}")
    implementation "io.micronaut:micronaut-inject"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut.validation:micronaut-validation"
    implementation "io.micronaut:micronaut-http-client"
    implementation "io.micronaut:micronaut-jackson-databind"
    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut.views:micronaut-views-thymeleaf"

    // AWS Lambda support
    implementation "io.micronaut.aws:micronaut-function-aws-api-proxy"
    runtimeOnly "com.amazonaws:aws-lambda-java-log4j2:1.6.0"

    // AWS DynamoDB SDK V2
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation "software.amazon.awssdk:dynamodb"

    // HTML sanitization
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    // Logging
    implementation "org.apache.logging.log4j:log4j-api:2.24.3"
    runtimeOnly "org.apache.logging.log4j:log4j-core:2.24.3"

    // Tests
    testAnnotationProcessor platform("io.micronaut.platform:micronaut-platform:${micronautVersion}")
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"

    testImplementation platform("io.micronaut.platform:micronaut-platform:${micronautVersion}")
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.jeasy:easy-random-core:${easyRandomVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:5.15.2"
}

application {
    mainClass = "dev.deskriders.printrider.Application"
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add('-parameters')
}

shadowJar {
    mergeServiceFiles()
}
